<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro | LBV  MX</title>
  <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body class="bg-white min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full">
    <div class="bg-white border border-gray-200 rounded-3xl p-8 shadow-lg">

      <div class="flex items-center gap-4 mb-6">
        <div class="h-14 w-28 rounded-3xl overflow-hidden border border-gray-200 bg-white logo-box">
          <img src="{{ url_for('static', filename='images/logo.jpg') }}" class="w-full h-full object-cover" alt="Logo">
        </div>
        <div>
          <h1 class="text-2xl font-black">Crear cuenta</h1>
          <p class="text-gray-500 text-sm">Solo usuario y contraseña.</p>
        </div>
      </div>

      <form method="POST" class="space-y-4">
        <div>
          <label class="block text-sm font-black text-gray-700 mb-1">Usuario</label>
          <input name="username" required class="w-full border px-4 py-3 rounded-2xl" placeholder="ej. nuevoUsuario">
        </div>
        <div>
          <label class="block text-sm font-black text-gray-700 mb-1">Contraseña</label>
          <input name="password" type="password" required class="w-full border px-4 py-3 rounded-2xl" placeholder="••••••••">
        </div>

        <button class="w-full bg-black text-[#f9f506] font-black py-3.5 rounded-2xl hover:opacity-95">
          Crear cuenta
        </button>

        <div class="text-center">
          <a href="{{ url_for('login') }}" class="font-black underline hover:text-gray-700">Volver</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
