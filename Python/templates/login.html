<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Acceso | LBVMX</title>
  <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body class="bg-white min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full">
    <div class="bg-white border border-gray-200 rounded-3xl p-8 shadow-lg">

      <div class="text-center mb-7">
        <div class="mx-auto h-20 w-44 rounded-3xl overflow-hidden border border-gray-200 bg-white shadow-sm logo-box">
          <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="Logo" class="w-full h-full object-cover">
        </div>
        <h1 class="text-2xl font-black mt-5">Inicia sesión</h1>
        <p class="text-gray-500 text-sm mt-2"></p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="bg-red-50 text-red-600 p-3 rounded-xl text-sm font-black mb-4 text-center border border-red-200">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" class="space-y-4">
        <div>
          <label class="block text-sm font-black text-gray-700 mb-1">Usuario</label>
          <input type="text" name="username" required
                 class="w-full border border-gray-300 px-4 py-3 rounded-2xl focus:ring-2 focus:ring-black outline-none"
                 placeholder="ej. victor">
        </div>
        <div>
          <label class="block text-sm font-black text-gray-700 mb-1">Contraseña</label>
          <input type="password" name="password" required
                 class="w-full border border-gray-300 px-4 py-3 rounded-2xl focus:ring-2 focus:ring-black outline-none"
                 placeholder="••••••••">
        </div>

        <button type="submit"
                class="w-full bg-black text-[#f9f506] font-black py-3.5 rounded-2xl hover:opacity-95 transition">
          Entrar
        </button>
      </form>

      <div class="mt-6 text-center">
        <a href="{{ url_for('registro') }}" class="font-black underline hover:text-gray-700">
          Crear cuenta nueva
        </a>
      </div>
      </div>
    </div>
  </div>
</body>
</html>
